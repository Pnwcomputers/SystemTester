name: Markdown Link Check

on:
  push:
    paths:
      - '**.md'
      - '.github/workflows/md-link-check.yml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/md-link-check.yml'

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No npm cache: the repo has no package-lock.json, and setup-node's
      # cache: 'npm' fails the job when no lock file exists.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Run markdown-link-check on all Markdown files
        run: |
          find . -name "*.md" -not -path "./.git/*" -print0 | xargs -0 -n1 markdown-link-check --retry
